# NetCert Pro — Micro-Lab 05: MPLS LSP
# Topology: 3 cRPD in line (PE1 ↔ P ↔ PE2)
# Level: JNCIS / JNCIP
# Duration: 20-25 minutes
# Technology: MPLS, LDP, RSVP-TE, LSP, label swapping

name: netcert-ml05-mpls-lsp

topology:
  kinds:
    juniper_crpd:
      image: crpd:24.2R1
      cpu: 1
      memory: 512M

  nodes:
    pe1:
      kind: juniper_crpd
      mgmt-ipv4: 172.100.1.2
      binds:
        - configs/pe1.cfg:/config/juniper.conf.gz:ro
      env:
        JUNOS_ROOT_PASSWORD: NetCert123

    p:
      kind: juniper_crpd
      mgmt-ipv4: 172.100.1.3
      binds:
        - configs/p.cfg:/config/juniper.conf.gz:ro
      env:
        JUNOS_ROOT_PASSWORD: NetCert123

    pe2:
      kind: juniper_crpd
      mgmt-ipv4: 172.100.1.4
      binds:
        - configs/pe2.cfg:/config/juniper.conf.gz:ro
      env:
        JUNOS_ROOT_PASSWORD: NetCert123

  links:
    - endpoints: ["pe1:eth1", "p:eth1"]
    - endpoints: ["p:eth1", "pe2:eth1"]
