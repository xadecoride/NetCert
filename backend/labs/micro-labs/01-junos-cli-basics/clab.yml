# NetCert Pro — Micro-Lab 01: JunOS CLI Basics
# Topology: 2 cRPD (r1 ↔ r2)
# Level: JNCIA / CCNA (foundational)
# Duration: 10-15 minutes
# Technology: JunOS CLI, interface configuration, connectivity verification

name: netcert-ml01-cli-basics

topology:
  kinds:
    juniper_crpd:
      image: crpd:24.2R1
      # vCPU and RAM limits for container
      cpu: 1
      memory: 512M

  nodes:
    r1:
      kind: juniper_crpd
      mgmt-ipv4: 172.100.1.2
      # Initial config is mounted from configs/r1.cfg
      # binds are used instead of startup-config for cRPD
      binds:
        - configs/r1.cfg:/config/juniper.conf.gz:ro
      env:
        JUNOS_ROOT_PASSWORD: NetCert123

    r2:
      kind: juniper_crpd
      mgmt-ipv4: 172.100.1.3
      binds:
        - configs/r2.cfg:/config/juniper.conf.gz:ro
      env:
        JUNOS_ROOT_PASSWORD: NetCert123

  links:
    # Direct connection between r1 and r2
    - endpoints: ["r1:eth1", "r2:eth1"]

