version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netcert-postgres
    environment:
      POSTGRES_DB: netcert
      POSTGRES_USER: netcert
      POSTGRES_PASSWORD: netcert
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netcert"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netcert-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: netcert-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_DSN: postgres://netcert:netcert@postgres:5432/netcert?sslmode=disable
      REDIS_ADDR: redis:6379
      APP_ENV: development
      # WARNING: This JWT secret is for local development ONLY.
      # config.go blocks startup in production if this value is used.
      JWT_SECRET: netcert-dev-secret-change-in-production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: netcert-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  redis-data:
